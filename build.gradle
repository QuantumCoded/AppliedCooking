buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '2.3-SNAPSHOT', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

// Release CI passes the version in from the git tag: `./gradlew build -Pmod_version=1.12.2-1.0.4`.
// Falls back to the checked-in default for local builds.
version = project.findProperty('mod_version') ?: '1.0.3'
group = 'dev.smolinacadena'
archivesBaseName = 'appliedcooking'

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}

minecraft {
    version = '1.12.2-14.23.5.2847'
    runDir = 'run'
    mappings = 'stable_39'
}

repositories {
    maven { url = 'https://cursemaven.com' }
}

dependencies {
    deobfCompile 'curse.maven:applied-energistics-2-223794:2747063'
    deobfCompile 'curse.maven:cooking-for-blockheads-231484:2862651'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        include 'version.properties'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
        exclude 'version.properties'
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'appliedcooking',
                'Specification-Vendor'    : 'smolinacadena',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : "${version}",
                'Implementation-Vendor'   : 'smolinacadena',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
